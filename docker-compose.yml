# bsdemo: a deliberately breakable shop for evaluating Better Stack.
#
#   pnpm bs:setup                       -> creates Better Stack resources, writes .env.bs
#   docker compose --env-file .env.bs up -d --build
#   pnpm bs:sync                        -> creates/updates Uptime monitors + status page for the tunnel URL
#
# Profile "collector": Better Stack collector (Docker logs, host metrics, eBPF traces, Postgres/Redis dashboards).
name: bsdemo

x-otel-env: &otel-env
  APP_ENV: ${APP_ENV:-demo}
  APP_RELEASE: ${APP_RELEASE:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_COMPRESSION: gzip
  # Skip the "process" resource detector: it stamps command-line args on every span/log/metric.
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,serviceinstance

x-node-env: &node-env
  <<: *otel-env
  DATABASE_URL: postgres://bsdemo:bsdemo@postgres:5432/bsdemo
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bsdemo
      POSTGRES_PASSWORD: bsdemo
      POSTGRES_DB: bsdemo
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=1000", "-c", "log_line_prefix=%m [%p] %u@%d "]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsdemo -d bsdemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  orders-api:
    build:
      context: .
      dockerfile: Dockerfile.node
      args: { SERVICE: orders-api }
    command: ["pnpm", "dev"]
    environment:
      <<: *node-env
      PORT: 4001
      INVENTORY_URL: http://inventory-api:4002
      PAYMENTS_URL: http://payments:4003
      WEB_URL: http://web:3000
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_ORDERS:-}
    volumes:
      - ./services/orders-api/src:/app/services/orders-api/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "4001:4001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile.node
      args: { SERVICE: inventory-api }
    command: ["pnpm", "dev"]
    environment:
      <<: *node-env
      PORT: 4002
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_INVENTORY:-}
    volumes:
      - ./services/inventory-api/src:/app/services/inventory-api/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "4002:4002"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  payments:
    build: ./services/payments
    environment:
      APP_ENV: ${APP_ENV:-demo}
      APP_RELEASE: ${APP_RELEASE:-dev}
      REDIS_URL: redis://redis:6379
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_PAYMENTS:-}
      OTEL_SERVICE_NAME: payments
      OTEL_RESOURCE_ATTRIBUTES: service.version=${APP_RELEASE:-dev},deployment.environment.name=${APP_ENV:-demo},service.namespace=bsdemo
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_TRACES_EXPORTER: ${OTEL_PY_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_PY_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_PY_EXPORTER:-otlp}
      OTEL_PYTHON_LOG_CORRELATION: "true"
    volumes:
      - ./services/payments/app:/app/app
    ports:
      - "4003:4003"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
      args: { SERVICE: worker }
    command: ["pnpm", "dev"]
    environment:
      <<: *node-env
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_WORKER:-}
      WORKER_CONCURRENCY: 3
    volumes:
      - ./services/worker/src:/app/services/worker/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.node
      args: { SERVICE: cron }
    command: ["pnpm", "dev"]
    environment:
      <<: *node-env
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_CRON:-}
      BS_HEARTBEAT_URL: ${BS_HEARTBEAT_URL:-}
      CRON_INTERVAL_MS: 60000
    volumes:
      - ./services/cron/src:/app/services/cron/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.node
      args: { SERVICE: loadgen }
    command: ["pnpm", "dev"]
    environment:
      REDIS_URL: redis://redis:6379
      ORDERS_URL: http://orders-api:4001
      WEB_URL: http://web:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./services/loadgen/src:/app/services/loadgen/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - orders-api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN:-}
        NEXT_PUBLIC_BETTER_STACK_INGESTING_URL: ${NEXT_PUBLIC_BETTER_STACK_INGESTING_URL:-}
        APP_RELEASE: ${APP_RELEASE:-dev}
    environment:
      <<: *otel-env
      ORDERS_URL: http://orders-api:4001
      BS_ERRORS_DSN: ${BS_ERRORS_DSN_WEB:-}
      BS_JS_TAG_TOKEN: ${BS_JS_TAG_TOKEN:-}
      NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${NEXT_PUBLIC_BETTER_STACK_SOURCE_TOKEN:-}
      NEXT_PUBLIC_BETTER_STACK_INGESTING_URL: ${NEXT_PUBLIC_BETTER_STACK_INGESTING_URL:-}
      NEXT_PUBLIC_BETTER_STACK_PROXY_PATH: /betterstack
    ports:
      - "3100:3000"
    depends_on:
      - orders-api
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - orders-api
      - inventory-api
      - payments
    restart: unless-stopped

  # Cloudflare quick tunnel: prints a random https://*.trycloudflare.com URL in its logs (pnpm tunnel:url).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    depends_on:
      - proxy
    restart: unless-stopped

  # Better Stack collector: docker compose --env-file .env.bs --profile collector up -d
  collector:
    profiles: [collector]
    image: ghcr.io/betterstackhq/collector:latest
    container_name: better-stack-collector
    restart: always
    uts: host
    cpus: 1.2
    mem_reservation: 512m
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /var/lib/better-stack/collector/healthcheck.sh ]; then /var/lib/better-stack/collector/healthcheck.sh; else exit 0; fi"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    environment:
      COLLECTOR_SECRET: ${COLLECTOR_SECRET:-}
      BASE_URL: https://telemetry.betterstack.com
      CLUSTER_COLLECTOR: "false"
      VECTOR_LOG_FORMAT: json
      HOSTNAME: ${COLLECTOR_HOSTNAME:-bsdemo-docker-desktop}
      COLLECT_OTEL_HTTP_PORT: 4318
      COLLECT_OTEL_GRPC_PORT: 4317
      INSTALLED_AS: docker
    ports:
      - "4318:4318"
      - "4317:4317"
    volumes:
      - /:/host:ro
      - /var/lib/better-stack:/var/lib/better-stack

  collector-host:
    profiles: [collector]
    image: ghcr.io/betterstackhq/collector-ebpf:latest
    container_name: better-stack-collector-host
    restart: always
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 90s
    privileged: true
    pid: host
    uts: host
    network_mode: host
    cpus: 1.0
    mem_reservation: 1536m
    mem_limit: 2048m
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /var/lib/better-stack/ebpf/healthcheck.sh ]; then /var/lib/better-stack/ebpf/healthcheck.sh; else exit 0; fi"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 2
    environment:
      GOMEMLIMIT: 1400MiB
      HOSTNAME: ${COLLECTOR_HOSTNAME:-bsdemo-docker-desktop}
      ENABLE_DOCKERPROBE: "true"
      INSTALLED_AS: docker
    volumes:
      - /:/host:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/security:/sys/kernel/security:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/better-stack:/var/lib/better-stack
    depends_on:
      - collector

volumes:
  pgdata:
